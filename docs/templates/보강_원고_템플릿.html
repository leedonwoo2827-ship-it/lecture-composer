<h2>1. 정규 표현식</h2>

<h3 data-id="q3-01-01"
    data-say="REGEXP_LIKE 는 문자열이 정규 표현식 패턴과 맞는지를 참과 거짓으로 돌려주는 조건 함수입니다. WHERE 절에서 LIKE 대신 쓰면 숫자만, 영문만 같은 복잡한 조건을 한 줄로 쓸 수 있습니다. 시험에서는 LIKE 의 퍼센트·밑줄과 정규식의 점·별표를 섞어 묻습니다."
    data-read="레젝스프 라이크 는 문자열이 정규 표현식 패턴과 맞는지를 참과 거짓으로 돌려주는 조건 함수입니다. 웨어 절에서 라이크 대신 쓰면 숫자만, 영문만 같은 복잡한 조건을 한 줄로 쓸 수 있습니다. 시험에서는 라이크 의 퍼센트·밑줄과 정규식의 점·별표를 섞어 묻습니다.">REGEXP_LIKE — 패턴이 맞는가</h3>
<ul>
  <li>REGEXP_LIKE(문자열, 패턴) → 참/거짓</li>
  <li>LIKE '%' ↔ 정규식 '.*'</li>
</ul>
<pre>SELECT ENAME FROM EMP
WHERE  REGEXP_LIKE(ENAME, '^[A-C]');</pre>

<h2>2. 조인 용어</h2>

<h3 data-id="q3-02-01"
    data-say="등가 조인은 두 테이블을 같다 조건으로 잇는 조인이고, 비등가 조인은 BETWEEN 이나 크다 작다 같은 조건으로 잇는 조인입니다. 급여 등급표처럼 범위로 짝을 찾을 때 비등가 조인을 씁니다. 시험에서는 조건식 모양만 보고 어느 쪽인지 고르게 합니다.">등가 조인 ↔ 비등가 조인</h3>
<table>
  <tr><th>구분</th><th>조건</th><th>예</th></tr>
  <tr><td>등가 조인</td><td>=</td><td>E.DEPTNO = D.DEPTNO</td></tr>
  <tr><td>비등가 조인</td><td>BETWEEN, &gt;, &lt;</td><td>E.SAL BETWEEN G.LOSAL AND G.HISAL</td></tr>
</table>
